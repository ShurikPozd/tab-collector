    "description": "<p>Привет! Команда <strong>Evrone</strong> занимается продуктовой разработкой стартапов и помогает в цифровой трансформации бизнеса в России, США и Европе. Думаю, что вы о нас слышали от <strong>Григория Петрова</strong> (Evrone Devrel).</p> <p>Сейчас мы ищем <strong>Middle+/Senior Python разработчика </strong>для работы над B2B платформой в сфере строительства.<strong> </strong></p> <p><strong>Детально про проект:</strong></p> <ul> <li><strong>B2B-платформа для автоматизации и цифровизации строительных процессов.</strong> Платформа объединяет инструменты для управления строительными объектами, трудовыми ресурсами, строительным контролем и документацией. В том числе включает систему распознавания лиц для учёта сотрудников на объектах, контроля доступа и автоматизации учёта рабочего времени и оплаты труда.</li> <li><strong>Команда:</strong> обычно 2-4 Backend-разработчика, 1-3 Frontend-разработчика, Product Manager, 1-2 QA и Team Lead.</li> <li><strong>Стек проекта:</strong> Python 3.9+ (GraphQL, REST API, WebSocket), PostgreSQL, MongoDB, Redis, RabbitMQ. GitLab CI (ArgoCD), Ansible</li> <li><strong>Процессы:</strong> Планирование - Проработка - Разработка - Тестирование - Приёмка - Релиз. Работа организована по Agile/Kanban с планированием спринтов и регулярной актуализацией backlog и roadmap.</li> <li><strong>Задачи: </strong>разработка и поддержка backend-сервисов на Python, проектирование и развитие API, работа с базами данных, интеграция со сторонними сервисами, реализация бизнес-логики, оптимизация производительности, написание unit- и integration-тестов, поиск и исправление ошибок, участие в code review и развитии архитектуры приложения.</li> <li><strong>Этапы рекрутинга:</strong> <ul> <li>HR-интервью (мотивация, soft-skills, технический блиц-опрос, и т.д.);</li> <li>Проверка реальности опыта (понадобятся подтверждающие документы на опыт в резюме);</li> <li>Техническое интервью;</li> <li>Интервью с проектным лидом и оффер.</li> </ul> </li> </ul> <p> </p> <p><strong>Что для нас важно:</strong></p> <ul> <li><strong>Готовность начинать рабочий день в 8 утра по МСК с фотоотчетом (особенность работы на данном проекте)</strong></li> <li>Опыт коммерческой разработки на<em><strong> Python от 6 лет </strong></em></li> <li>Высшее техническое образование;</li> <li>FastAPI и asyncio (синхронный/асинхронный код);</li> <li>Умение писать и оптимизировать SQL-запросы (не только через ORM);</li> <li>Опыт работы с NoSQL</li> <li>Опыт с RabbitMQ (или аналогичных брокеров сообщений);</li> <li>Опыт работы с Git (GitFlow, Merge Requests, Code Review)</li> </ul> <p><strong>Будет плюсом с </strong>:</p> <ul> <li>GraphQL (Apollo, Strawberry, Ariadne);</li> <li>Инструментами миграций (Sqitch, Alembic);</li> <li>WebSockets;</li> <li>Docker и CI/CD, деплой;</li> </ul> <p>Заработная плата зависит от уровня и определяется после прохождения технического собеседования.</p> <p> </p> <p><strong>Почему Evrone:</strong></p> <ul> <li>Мы занимаемся технически сложными, высоконагруженными, наукоёмкими проектами, проектами с большой бизнес логикой или большой серверной инфраструктурой. Нам доверяют: аналитику, проектирование интерфейсов и дизайн, разработку, инфраструктуру и эксплуатацию. Мы становимся технической командой проекта целиком или консультируем и расширяем возможности существующих команд наших клиентов.</li> <li>Кроме того, Evrone помогает развиваться сообществу разработчиков. Мы делаем самую большую в России конференцию по Ruby — RubyRussia, проводим технические митапы, делаем свой новостной дайджест, а также спонсируем и помогаем в проведении конференций по Go, Python, <em>React</em>/Vue и функциональным языкам.</li> <li>Наши инженеры выступают на ведущих конференциях России и Европы и вносят вклад в Open Source проекты, мы берем интервью у лидеров комьюнити и пишем статьи на самые горячие темы индустрии. В этом году мы ставили стенд и выступали на конференциях <strong>Highload</strong> и <strong>TeamLeadConf</strong>.</li> <li>Вся команда работает удаленно с 2008 года. Мы знаем как организовать распределенную разработку комфортно и эффективно. Есть офисы для работы и встреч в Москве и Воронеже, а также офисы продаж в Сан-Франциско и Берлине.</li> </ul> <p><strong>Что предлагаем:</strong></p> <ul> <li>Удаленную фултайм работу и мягкий график. Достаточно синхронизировать тайм-зоны и иметь пересечения рабочего времени с командой;</li> <li>Качественный онбординг и hr-менеджмент (1:1, Grow Review). По желанию меняем проекты, не даем стагнировать. При формировании команды проекта учитываем профессиональные или личные интересы разработчиков;</li> <li>Работу в разновозрастном, разнополом и потрясающе дружном и профессиональном коллективе;</li> <li>Хорошо организованный воркфлоу, отсутствие бюрократии. Работа на доверии.</li> <li>Наши разработчики работают<strong> только над одним </strong>проектом. <strong>Без</strong> постоянных переключений между ними.</li> </ul> <p><strong>Одна из ценностей Evrone – работа с удовольствием.</strong></p> <p>Для этого мы придумали <strong>Evrone Benefits.</strong> Каждому из нас выделяется годовой бюджет, автоматически пополняемый каждый новый год вашей работы в Evrone. <strong>Его можно потратить на полезные категории трат, направленные на:</strong></p> <ul> <li>ДМС и здоровье;</li> <li>Спорт и абонемент для фитнеса или инвентарь для спорта;</li> <li>Курсы иностранного языка;</li> <li>Техника для работы и улучшение рабочего места;</li> <li>Обучение: курсы, тренинги, мастер-классы, семинары, книги и конференции.</li> </ul> <p><strong>Бонусы и премии:</strong></p> <ul> <li>Повышение зарплаты по мере роста компетенций (по результатам ассесмента);</li> <li>Премии за привлечение новых сотрудников и новых клиентов;</li> <li>Дополнительная премия за выступления на конференциях и митапах;</li> <li>У вас есть возможность принять участие в проведении технических интервью специалистов, которые могут стать вашими коллегами. Проведение интервью оплачивается.</li> </ul> <p><strong>Обучение и рост компетенций:</strong></p> <ul> <li>Проводим митапы. Вы можете быть как и слушателем, так и спикером;</li> <li>У нас есть культура менторства. В повседневных задачах и планировании карьеры будет помогать наставник;</li> <li>Развивать профессиональный уровень можно с помощью системы ассессмента Evrone Challenge;</li> <li>Есть внутренняя библиотека с электронными книгами и записанными курсами;</li> <li>Работаем и дружим с западными заказчиками, есть возможность практиковать свой английский.</li> </ul> <p><strong>Возможность стать докладчиком или автором:</strong></p> <ul> <li>Если вы хотите выступить на оффлайн конференции, мы поможем вам подготовить контент для доклада и сделаем крутые слайды. DevRel Evrone (Григорий Петров) поможет подготовиться к выступлению на конференции, окажем поддержку на самой конференции и подготовим материалы с вашим докладом.</li> <li>Если вы хотите выступить на онлайн конференции, помимо помощи по подготовке доклада и подбору конференции, мы организуем вам студийную съемку или трансляцию вашего доклада;</li> <li>У нас есть блоги на всех популярных платформах России и мира. Наши редакторы и профессиональные авторы еженедельно выпускают новые материалы;</li> <li>Если вы написали статью, мы нарисуем для нее иллюстрации и поможем вам ее оформить и опубликовать. Если у вас есть только идея - редакторы помогут сформулировать мысли, оформить пост самостоятельно и правильно опубликовать для максимального охвата.</li> </ul> <p><strong>Возможность прокачаться в Open Source:</strong></p> <ul> <li>Если у вас есть популярные open source проекты – мы поможем с их продвижением и окажем поддержку в развитии;</li> <li>Если вы контрибьютите в популярные проекты с открытым исходным кодом, мы оплатим часы, которые вы на это потратили.</li> <li>Если вы ничего этого не делаете, но очень хочется начать – в Evrone есть менторы, которые помогут вам сделать первые шаги: подберут задачки для старта, помогут решить их и правильно оформить pr.</li> </ul>",
